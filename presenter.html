<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Presenter</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  body { margin: 0; background: #14130F; color: #F4EBDA; font-family: 'Heebo', Arial, sans-serif; padding: 28px 36px; }
  .top { direction: ltr; display: flex; justify-content: space-between; font: 600 18px/1.3 'Inter', sans-serif; color: #D9B777; letter-spacing: .06em; }
  .bar { direction: ltr; height: 6px; background: #3a362e; margin: 10px 0 22px; }
  .bar i { display: block; height: 100%; background: #D9B777; width: 0; }
  .note { font-size: 38px; line-height: 1.55; min-height: 300px; }
  .aside { margin-top: 18px; font-size: 24px; line-height: 1.5; color: #CDBFA5; }
  .next { direction: ltr; margin-top: 28px; font: 400 20px/1.3 'Inter', sans-serif; color: #CDBFA5; }
  .keys { direction: ltr; margin-top: 18px; font: 400 15px/1.5 'Inter', sans-serif; color: #8a8171; }
</style>
</head>
<body tabindex="0">
<div class="top"><span id="scr">-</span><span id="clock">0:00</span></div>
<div class="bar"><i id="bar"></i></div>
<div class="note" id="note"></div>
<div class="aside" id="aside"></div>
<div class="next" id="next"></div>
<div class="keys">Right/Down/PageDown/Space = next · Left/Up/PageUp = back (sent to the main window)</div>
<script>
  var ch = new BroadcastChannel('lia-talk');
  var t0 = Date.now(), bud = 0, kb = 0;
  function mm(s) { var m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + (x < 10 ? '0' : '') + x; }
  setInterval(function () { document.getElementById('clock').textContent = 'total ' + mm((Date.now() - t0) / 1000); }, 500);
  ch.onmessage = function (e) {
    var m = e.data; if (!m || m.type !== 'state') return;
    document.getElementById('scr').textContent = m.id + ' · ' + m.title + ' · step ' + m.k + '/' + m.clicks + (m.time ? ' · budget ' + m.time : '');
    document.getElementById('note').textContent = m.note;
    document.getElementById('aside').innerHTML = (m.aside || []).map(function (a) { return '(' + a.replace(/</g, '&lt;') + ')'; }).join('<br>');
    document.getElementById('next').textContent = m.next ? 'Next screen: ' + m.next : 'Last screen';
    document.getElementById('bar').style.width = (100 * (m.i + 1) / m.total) + '%';
  };
  document.addEventListener('keydown', function (e) {
    var n = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'], p = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'];
    if (n.indexOf(e.key) >= 0) { e.preventDefault(); ch.postMessage({ type: 'cmd', cmd: 'next' }); }
    if (p.indexOf(e.key) >= 0) { e.preventDefault(); ch.postMessage({ type: 'cmd', cmd: 'prev' }); }
  });
  ch.postMessage({ type: 'cmd', cmd: 'hello' });
</script>
</body>
</html>
